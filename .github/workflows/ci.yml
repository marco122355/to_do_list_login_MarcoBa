name: Run Unit Tests

on:
  push: # Ejecuta las pruebas en cualquier push, independientemente de la rama.
    branches: 
      - "**" # Todas las ramas.
  pull_request: # También en cualquier pull request.
    branches: 
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'  # Cambia según la versión de Python que estés usando.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python manage.py test
